aid: inscripta
name: Inscripta
description: 'Inscripta, Inc. was a Boulder, Colorado digital genome engineering company
  founded in 2015 that built the Onyx benchtop platform — an automated CRISPR instrument,
  consumables, assays and a cloud-based Inscripta Engineering Portal that let scientists
  design and track millions of precise single-cell genome edits in one experiment. It
  licensed the MAD7 nuclease, acquired Infinome Biosciences and Sestina Bio in 2023 to
  pivot toward sustainable biomanufacturing, and merged with Manus (Manus Bio) in April
  2025 to form an end-to-end bioalternatives company. Inscripta publishes no public API,
  developer portal, or machine-readable specification; its only public developer artifact
  is BioCantor, an MIT-licensed Python genome-annotation library on PyPI and GitHub.
  inscripta.com now serves a single merger landing page pointing at manusbio.com.'
